[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotent-kv"
version = "0.2.1"
description = "Zero-Copy In-Place KV-Cache Compactor for vLLM & Deep Learning Accelerators"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dr. A. Emre ÇETİN", email = "aemre.cetin@gmail.com" }
]
keywords = [
    "vllm", "kv-cache", "llm", "triton", "cuda", "memory-compaction", 
    "zero-copy", "idempotent", "in-situ", "inference-acceleration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.0.0",
    "idempotent-core>=1.1.0"
]

[project.urls]
Homepage = "https://github.com/aemre-cetin/idempotent-kv"
Repository = "https://github.com/aemre-cetin/idempotent-kv"
Documentation = "https://github.com/aemre-cetin/idempotent-kv#readme"

[tool.setuptools.packages.find]
where = ["src"]
